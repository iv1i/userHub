# Зоны для ограничения запросов - добавляется в http блок (обычно в nginx.conf)
# Если нет доступа к основному конфигу, можно добавить в server блок
limit_req_zone $binary_remote_addr zone=one:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=two:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
    listen 80;
    server_name localhost;
    root /var/www/html/src/public;
    index index.php index.html;

    # Базовые настройки безопасности
    server_tokens off;
    client_max_body_size 10m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 5s;
    send_timeout 10s;

    # Основные лимиты от DDoS
    limit_req zone=two burst=20 nodelay;
    limit_conn addr 50;

    # Защита от ботов и сканеров
    if ($http_user_agent ~* (wget|curl|scan|bot|spider|crawler|php)) {
        return 444;
    }

    # Блокировка пустых User-Agent
    if ($http_user_agent = "") {
        return 444;
    }

    # Защита от SQL-инъекций в URI
    if ($query_string ~* "union.*select.*\(|union.*all.*select.*") {
        return 444;
    }

    # Основной location - все запросы направляем на index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;

        # Дополнительная защита для корневой локации
        limit_req zone=two burst=15 nodelay;
    }

    # Особо защищенная зона для PHP-обработки
    location ~ \.php$ {
        # Разрешаем только index.php
        if ($uri != "/index.php") {
            return 404;
        }

        # Строгие лимиты для PHP
        limit_req zone=one burst=5 nodelay;
        limit_conn addr 10;

        fastcgi_pass web:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Таймауты для PHP
        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 30s;
        fastcgi_read_timeout 30s;

        include fastcgi_params;
    }

    # Статические файлы - меньше ограничений
    location ~* \.(woff|woff2|ttf|eot)$ {
        add_header Access-Control-Allow-Origin *;
        types {
            font/woff2 woff2;
            font/woff woff;
            font/ttf ttf;
            application/vnd.ms-fontobject eot;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Меньше ограничений для статики
        limit_req zone=two burst=30 nodelay;
    }

    # CSS, JS, изображения
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;

        # Меньше ограничений для статики
        limit_req zone=two burst=30 nodelay;
    }

    # Защита от доступа к скрытым файлам
    location ~ /\.ht {
        deny all;
        return 404;
    }

    # Блокировка системных файлов
    location ~ /\.(env|git|svn|htpasswd) {
        deny all;
        return 404;
    }

    location ~ /(vendor|node_modules|storage|logs)/ {
        deny all;
        return 404;
    }

    # Защита от сканирования
    location ~* (\.bak|\.backup|\.old|\.tmp|\.swp)$ {
        deny all;
        return 404;
    }

    # Обработка ошибок 429 (Too Many Requests)
    error_page 429 /429.html;
    location = /429.html {
        internal;
        return 429 "Too Many Requests. Please slow down.";
    }

    # Защита от больших запросов
    location ~* "(\.php|\.asp|\.aspx|\.jsp|\.pl)" {
        if ($uri !~ "^/index\.php") {
            return 444;
        }
    }
}

