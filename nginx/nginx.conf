server {
    listen 80;
    server_name localhost;
    return 308 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name localhost;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/localhost.crt;
    ssl_certificate_key /etc/nginx/ssl/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    root /var/www/html/src/public;
    index index.php index.html;

    # Добавляем настройки для корректной обработки POST-данных
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_body_timeout 120s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass web:9000;
        fastcgi_index index.php;
        # 1. Сначала включаем стандартные параметры
        include fastcgi_params;
        # 2. Только ПОТОМ переопределяем нужные нам
        fastcgi_param HTTPS on;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_ACCEPT_CHARSET "utf-8";
        fastcgi_param CONTENT_TYPE "text/html; charset=utf-8";
        # Исправление проблемы с POST-данными через SSL
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param HTTP_HOST $server_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~* \.(woff|woff2|ttf|eot)$ {
        add_header Access-Control-Allow-Origin *;
        types {
            font/woff2 woff2;
            font/woff woff;
            font/ttf ttf;
            application/vnd.ms-fontobject eot;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}